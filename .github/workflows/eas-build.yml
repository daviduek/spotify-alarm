name: EAS Build

# Manual: Actions → EAS Build → Run workflow. Needs the EXPO_TOKEN repository secret
# (expo.dev → Account settings → Access tokens) and, for iOS, Apple credentials stored in EAS.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        required: true
        default: android
        type: choice
        options: [android, ios, all]
      profile:
        description: EAS build profile
        required: true
        default: development
        type: choice
        options: [development, preview, production]

jobs:
  build:
    name: eas build (${{ inputs.platform }} · ${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build on EAS (non-blocking)
        working-directory: apps/mobile
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
        env:
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
