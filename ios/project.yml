name: SpotifyAlarm
options:
  bundleIdPrefix: com.daviduek
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  SpotifyAlarm:
    type: application
    platform: iOS
    sources:
      - path: SpotifyAlarm
        excludes:
          - "Resources/Info.plist"
          - "SpotifyAlarm.entitlements"
    resources:
      - SpotifyAlarm/Resources/Assets.xcassets
      - SpotifyAlarm/Resources/SilentLoop.m4a
    info:
      path: SpotifyAlarm/Resources/Info.plist
      properties:
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        LSApplicationQueriesSchemes:
          - spotify
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - spotifyalarm
            CFBundleURLName: com.daviduek.spotifyalarm.oauth
        NSAppleMusicUsageDescription: "Spotify Alarm uses audio playback to wake you up with your music."
        NSUserNotificationsUsageDescription: "Spotify Alarm needs notifications to fire your alarms reliably."
        BGTaskSchedulerPermittedIdentifiers:
          - com.daviduek.spotifyalarm.prewarm
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    entitlements:
      path: SpotifyAlarm/SpotifyAlarm.entitlements
      properties:
        com.apple.developer.usernotifications.critical-alerts: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.daviduek.spotifyalarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daviduek.spotifyalarm
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: "-ObjC"
    dependencies:
      - package: SpotifyiOS
        product: SpotifyiOS

packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    from: 3.0.0
