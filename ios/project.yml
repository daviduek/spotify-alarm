name: SpotifyAlarm
options:
  bundleIdPrefix: com.daviduek
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  SpotifyAlarm:
    type: application
    platform: iOS
    sources:
      - path: SpotifyAlarm
        excludes:
          - "Resources/Info.plist"
          - "SpotifyAlarm.entitlements"
          - "Resources/AUDIO_PLACEHOLDERS.md"
    resources:
      - SpotifyAlarm/Resources/Assets.xcassets
      - path: SpotifyAlarm/Resources/SilentLoop.m4a
        optional: true
      - path: SpotifyAlarm/Resources/FallbackTone.m4a
        optional: true
    info:
      path: SpotifyAlarm/Resources/Info.plist
      properties:
        UILaunchStoryboardName: ""
    entitlements:
      path: SpotifyAlarm/SpotifyAlarm.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daviduek.spotifyalarm
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: "-ObjC"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor"
    dependencies:
      # Spotify iOS SDK ships as a binary .xcframework — not via SwiftPM.
      # Run `ios/Scripts/install-spotify-sdk.sh` to download it into Vendor/.
      # The Swift code uses `#if canImport(SpotifyiOS)` so the app builds
      # without it (App Remote becomes a no-op; Web API path still works).
      - framework: Vendor/SpotifyiOS.xcframework
        optional: true
        embed: true
